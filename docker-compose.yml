services:
  # MSSQL Server Database
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: innovacion-crm-mssql
    ports:
      - "5001:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Pass1234"
      MSSQL_PID: "Express"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./apps/database:/scripts
    networks:
      - innovacion-net
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Pass1234", "-C", "-Q", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: innovacion-crm-backend
    ports:
      - "5002:3000"
    environment:
      NODE_ENV: development
      DATABASE_HOST: mssql
      DATABASE_PORT: 1433
      DATABASE_USER: sa
      DATABASE_PASSWORD: Pass1234
      DATABASE_NAME: InnovacionCRM
    depends_on:
      - mssql
    volumes:
      - ./apps/backend/src:/app/src
    networks:
      - innovacion-net
    command: npm run start:dev

  # Angular Frontend
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: innovacion-crm-frontend
    ports:
      - "5003:4200"
    environment:
      API_URL: http://backend:3000/api
    depends_on:
      - backend
    volumes:
      - ./apps/frontend/src:/app/src
    networks:
      - innovacion-net
    command: ng serve --host 0.0.0.0 --poll=2000

volumes:
  mssql-data:

networks:
  innovacion-net:
    driver: bridge
