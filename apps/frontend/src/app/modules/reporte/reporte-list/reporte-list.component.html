<div class="container">
  <div class="header">
    <h2>Generador de Reportes</h2>
  </div>

  <div class="report-section">
    <h3>Reporte por Fecha</h3>
    <form [formGroup]="formPorFecha" (ngSubmit)="generarPorFecha()" class="form">
      <div class="form-group">
        <label for="fecha_inicio">Fecha Inicio</label>
        <input type="date" id="fecha_inicio" formControlName="fecha_inicio" class="form-control" />
      </div>
      <div class="form-group">
        <label for="fecha_fin">Fecha Fin</label>
        <input type="date" id="fecha_fin" formControlName="fecha_fin" class="form-control" />
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="loading">Generar</button>
    </form>
  </div>

  <div class="report-section">
    <h3>Reporte por Gestor</h3>
    <form [formGroup]="formPorGestor" (ngSubmit)="generarPorGestor()" class="form">
      <div class="form-group">
        <label for="id_gestor">Gestor</label>
        <select id="id_gestor" formControlName="id_gestor" class="form-control">
          <option value="">Seleccionar gestor</option>
          <option *ngFor="let g of gestores" [value]="g.id">{{ g.nombre }}</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="loading">Generar</button>
    </form>
  </div>

  <div class="report-section">
    <h3>Reporte Ganadas/Perdidas</h3>
    <button class="btn btn-primary" (click)="generarGanadasPerdidas()" [disabled]="loading">
      Generar
    </button>
  </div>

  <div *ngIf="loading" class="loading">Generando reporte...</div>

  <div *ngIf="reporteActual.length > 0 && !loading" class="results">
    <h3>Resultados</h3>
    <table class="table">
      <thead>
        <tr>
          <th *ngFor="let key of (reporteActual[0] | keyvalue) | slice: 0:5">
            {{ key.key }}
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of reporteActual">
          <td *ngFor="let key of (row | keyvalue) | slice: 0:5">{{ key.value }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
